<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Теплый нежно-оранжевый фон -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC5A8"/>
      <stop offset="100%" stop-color="#FF8C5A"/>
    </linearGradient>
    
    <!-- Васильковый градиент лепестков -->
    <linearGradient id="petal-grad" x1="256" y1="256" x2="256" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A6DB8"/>
      <stop offset="100%" stop-color="#8AAEFF"/>
    </linearGradient>
    
    <!-- Нежная тень для объема (Material 3) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#471905" flood-opacity="0.15"/>
    </filter>
    
    <!-- Паттерн одного лепестка василька с характерными зубчиками -->
    <g id="petal">
      <path d="M256,256 C230,160 190,120 200,60 L230,90 L256,40 L282,90 L312,60 C322,120 282,160 256,256 Z" fill="url(#petal-grad)" />
    </g>
  </defs>

  <!-- Заливка фона (квадратная, скругления контролируются CSS/ОС) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Цветок -->
  <g filter="url(#shadow)">
    <use href="#petal" />
    <use href="#petal" transform="rotate(72 256 256)" />
    <use href="#petal" transform="rotate(144 256 256)" />
    <use href="#petal" transform="rotate(216 256 256)" />
    <use href="#petal" transform="rotate(288 256 256)" />
    
    <!-- Сердцевина цветка -->
    <circle cx="256" cy="256" r="45" fill="#1C336D"/>
    <circle cx="256" cy="256" r="15" fill="#FFC5A8"/>
  </g>
</svg>